<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | AWS S3 Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply saved language preference before page renders to avoid flash
      (function () {
        var lang = localStorage.getItem("preferred-lang");
        if (lang === "ar") {
          document.documentElement.setAttribute("lang", "ar");
          document.documentElement.setAttribute("dir", "rtl");
        }
      })();
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #232F3E 0%, #3d4f63 100%);
            color: #FFFFFF;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .error-container {
            text-align: center;
            max-width: 600px;
            animation: fadeInUp 0.6s ease;
        }

        .error-code {
            font-size: 120px;
            font-weight: 700;
            color: #FF9900;
            line-height: 1;
            margin-bottom: 20px;
            text-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .error-title {
            font-size: 2rem;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .error-message {
            font-size: 1.1rem;
            color: #E9ECEF;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .error-icon {
            font-size: 80px;
            margin-bottom: 30px;
            animation: float 3s ease-in-out infinite;
        }

        .btn-home {
            display: inline-block;
            padding: 15px 40px;
            background-color: #FF9900;
            color: #FFFFFF;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(255, 153, 0, 0.3);
        }

        .btn-home:hover {
            background-color: #e68a00;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(255, 153, 0, 0.4);
        }

        .suggestions {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
        }

        .suggestions h3 {
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: #FF9900;
        }

        .suggestions ul {
            list-style: none;
            padding: 0;
        }

        .suggestions li {
            margin: 10px 0;
        }

        .suggestions a {
            color: #17A2B8;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .suggestions a:hover {
            color: #FF9900;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-20px);
            }
        }

        @media (max-width: 768px) {
            .error-code {
                font-size: 80px;
            }

            .error-title {
                font-size: 1.5rem;
            }

            .error-message {
                font-size: 1rem;
            }

            .error-icon {
                font-size: 60px;
            }
        }

        [dir="rtl"] body {
            text-align: right;
        }

        [dir="rtl"] .suggestions ul {
            padding-right: 0;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-icon">☁️</div>
        <div class="error-code">404</div>
        <h1 class="error-title" data-i18n="err-title">Oops! Page Not Found</h1>
        <p class="error-message" data-i18n="err-msg">
            The page you're looking for seems to have drifted into the cloud. 
            It might have been moved, deleted, or never existed in the first place.
        </p>
        <a href="/" class="btn-home" data-i18n="err-btn">← Back to Home</a>
        
        <div class="suggestions">
            <h3 data-i18n="err-suggest-h">You might be looking for:</h3>
            <ul>
                <li><a href="/">🏠 <span data-i18n="err-link-home">Homepage</span></a></li>
                <li><a href="/#features">✨ <span data-i18n="err-link-features">Features</span></a></li>
                <li><a href="/#architecture">🏗️ <span data-i18n="err-link-arch">Architecture</span></a></li>
                <li><a href="/#demo">🎥 <span data-i18n="err-link-demo">Demo</span></a></li>
                <li><a href="/#contact">📧 <span data-i18n="err-link-contact">Contact</span></a></li>
            </ul>
        </div>
    </div>
    <script>
      (function () {
        var errorTranslations = {
          en: {
            "err-title": "Oops! Page Not Found",
            "err-msg": "The page you're looking for seems to have drifted into the cloud. It might have been moved, deleted, or never existed in the first place.",
            "err-btn": "← Back to Home",
            "err-suggest-h": "You might be looking for:",
            "err-link-home": "Homepage",
            "err-link-features": "Features",
            "err-link-arch": "Architecture",
            "err-link-demo": "Demo",
            "err-link-contact": "Contact",
          },
          ar: {
            "err-title": "عذراً! الصفحة غير موجودة",
            "err-msg": "يبدو أن الصفحة التي تبحث عنها قد انجرفت إلى السحابة. ربما تم نقلها أو حذفها أو أنها لم تكن موجودة أصلاً.",
            "err-btn": "→ العودة للرئيسية",
            "err-suggest-h": "ربما تبحث عن:",
            "err-link-home": "الرئيسية",
            "err-link-features": "المميزات",
            "err-link-arch": "المعمارية",
            "err-link-demo": "التجربة",
            "err-link-contact": "تواصل",
          },
        };
        var lang = localStorage.getItem("preferred-lang") === "ar" ? "ar" : "en";
        var t = errorTranslations[lang];
        document.querySelectorAll("[data-i18n]").forEach(function (el) {
          var key = el.getAttribute("data-i18n");
          if (t[key] !== undefined) {
            el.textContent = t[key];
          }
        });
        if (lang === "ar") {
          document.title = "404 - الصفحة غير موجودة | AWS S3 Portfolio";
        }
      })();
    </script>
</body>
</html>
